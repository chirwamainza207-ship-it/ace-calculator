name: Build Android APK with Buildozer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Cloud Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # THIS STEP AUTO-ACCEPTS THE ANDROID LICENSE TERMS FOR YOU
    - name: Pre-Accept Android SDK Licenses
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | sdkmanager --licenses || true

    - name: Get Buildozer Cache
      uses: actions/cache@v4
      with:
        path: ./.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}

    - name: Build with Buildozer Action
      uses: ArtemGovorov/buildozer-action@v1
      id: buildozer
      with:
        workdir: .
        buildozer_version: master

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AceCalculator-APK
        path: ${{ steps.buildozer.outputs.filename }}
        
